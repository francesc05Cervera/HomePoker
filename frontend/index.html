<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="api-origin" content="">
<meta name="theme-color" content="#101713">
<title>HomePoker · Texas Hold’em</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="site-header"><a class="brand" href="/"><span aria-hidden="true">♠</span> HomePoker</a><span id="connection"></span><button id="exit" hidden>Lascia il tavolo</button></header>
<main>
<section id="home">
  <div class="intro"><p class="eyebrow">Texas Hold’em multiplayer</p><h1>Ci vediamo al tavolo.</h1><p>Da 2 a 9 giocatori con fiches virtuali.</p></div>
  <div class="lobby">
    <form id="create">
      <h2>Crea un tavolo</h2>
      <label>Il tuo nome<input name="name" maxlength="24" autocomplete="nickname" required></label>
      <label>Nome del tavolo<input name="roomName" maxlength="36" value="Serata poker" required></label>
      <label>Modalità<select name="mode" id="mode"><option value="tournament">Torneo</option><option value="cash">Cash Game</option></select></label>
      <label>Fiches iniziali<input name="stack" type="number" value="1500" min="20" max="1000000" required></label>
      <div class="split"><label>Piccolo buio<input name="small" type="number" value="10" min="1" max="9999" required></label><label>Grande buio<input name="big" type="number" value="20" min="2" max="10000" required></label></div>
      <label id="blindSettings">Aumenta i bui ogni (minuti)<input name="blindMinutes" type="number" value="15" min="1" max="180" required></label>
      <button class="primary">Crea tavolo</button>
    </form>
    <form id="join">
      <h2>Unisciti</h2>
      <label>Il tuo nome<input name="name" maxlength="24" autocomplete="nickname" required></label>
      <label>Codice del tavolo<input name="code" placeholder="A7K4TV" pattern="[A-Za-z2-9]{6}" maxlength="6" required></label>
      <button class="primary">Entra al tavolo</button>
      <button id="openRecover" type="button">Recupera il tuo posto</button>
    </form>
  </div>
</section>
<p id="error" role="alert" hidden></p>
<section id="game" hidden>
  <div class="game-head">
    <div><p id="stage" class="eyebrow"></p><h1 id="roomName"></h1></div>
    <div class="invite"><span id="code"></span><button id="copy">Copia invito</button><button id="openRecoveryCode">Il mio codice di recupero</button></div>
  </div>
  <div class="table-meta"><span id="blinds"></span><span id="nextBlinds" hidden></span></div>
  <section class="arena" aria-label="Tavolo da poker">
    <div class="felt">
      <div class="community">
        <p id="pot" class="pot"></p>
        <div id="board" class="cards" aria-label="Carte comuni"></div>
        <p id="turn" role="status"></p>
        <p id="timer" class="timer" hidden></p>
      </div>
    </div>
    <div id="seats" aria-label="Giocatori"></div>
  </section>
  <div id="result" class="results" role="status" hidden></div>
  <section class="table-actions" aria-label="Azioni di gioco">
    <button id="start" class="primary" hidden>Distribuisci le carte</button>
    <button id="pause" hidden></button>
    <div id="moves" hidden>
      <div class="quick"><button id="fold">Fold</button><button id="call" class="primary"></button><button id="potBet" type="button" hidden></button><button id="doubleBet" type="button" hidden></button></div>
      <form id="raise" hidden><label for="target">Rilancio totale</label><input id="target" type="number" step="1" required><button id="raiseButton">Rilancia</button><button id="allIn" type="button">All-in</button></form>
    </div>
  </section>
  <section class="panels">
    <div id="reloadPanel" class="panel" hidden>
      <h2>Rientro al tavolo</h2>
      <p id="reloadStatus"></p>
      <form id="reloadForm" hidden>
        <label for="reloadAmount">Fiches da ricaricare</label>
        <div class="split"><input id="reloadAmount" type="number" step="1" min="1" required><button class="primary">Invia richiesta</button></div>
      </form>
    </div>
    <div id="adminPanel" class="panel" hidden><h2>Richieste di ricarica</h2><div id="requests"></div></div>
    <details id="handPanel" class="panel" hidden><summary>Ultima mano</summary><div id="lastHand"></div></details>
  </section>
</section>
</main>
<dialog id="recoverDialog" aria-labelledby="recoverTitle">
  <form id="recover">
    <h2 id="recoverTitle">Recupera il tuo posto</h2>
    <label>Codice del tavolo<input name="code" pattern="[A-Za-z2-9]{6}" maxlength="6" required></label>
    <label>Codice personale<input name="recoveryCode" minlength="24" maxlength="24" autocomplete="off" spellcheck="false" required></label>
    <p id="recoverError" role="alert" hidden></p>
    <div class="dialog-actions"><button id="cancelRecover" type="button">Annulla</button><button class="primary">Recupera posto</button></div>
  </form>
</dialog>
<dialog id="recoveryCodeDialog" aria-labelledby="recoveryCodeTitle">
  <h2 id="recoveryCodeTitle">Il mio codice di recupero</h2>
  <p>Conservalo insieme al codice del tavolo. Tienilo per te.</p>
  <code id="recoveryCode"></code>
  <div class="dialog-actions"><button id="closeRecoveryCode">Chiudi</button><button id="copyRecovery" class="primary">Copia codice</button></div>
</dialog>
</body>
</html>
